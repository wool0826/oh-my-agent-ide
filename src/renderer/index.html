    <div class="side-foot"><button class="btn btn-ghost btn-icon btn-lg" data-action="open-settings" data-i18n-tip="set.title"><svg aria-hidden="true"><use href="#s-gear"/></svg></button><button class="btn btn-ghost btn-icon btn-lg" id="dnd-mark" data-action="open-settings" data-v="alerts" hidden><svg aria-hidden="true"><use href="#s-moon"/></svg></button></div>
  </nav>
  <div class="rz nodrag" id="rz-side" role="separator" aria-label="Resize the sidebar" data-i18n-aria="aria.resize" aria-orientation="vertical" aria-controls="side" tabindex="0"></div>

  <header class="toolbar drag">
    <button class="tbtn plain nodrag" id="side-toggle" data-action="side-toggle" aria-controls="side"><svg aria-hidden="true"><use href="#s-side-l"/></svg></button>
    <span class="seg seg-glass nodrag" id="views" role="tablist" aria-label="Views" data-i18n-aria="aria.views">
      <button role="tab" data-v="chat" aria-selected="true" tabindex="0" data-i18n="nav.chat">Chat</button><button role="tab" data-v="worker" aria-selected="false" tabindex="-1">Worker</button><button role="tab" data-v="repo" aria-selected="false" tabindex="-1" data-i18n="nav.repo">Repositories</button><button role="tab" data-v="memory" aria-selected="false" tabindex="-1" data-i18n="nav.memory">Memory</button>
    </span>
    <button class="tbtn nodrag" id="cmdk-btn" data-action="cmdk-open" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#s-search"/></svg></button>
    <div class="usage nodrag" id="usage" tabindex="0" role="img" aria-label="Usage per account" aria-describedby="usage-pop"></div>
    <button class="tbtn nodrag" id="sleep-btn" data-action="sleep-toggle" aria-pressed="false"><svg aria-hidden="true"><use href="#s-moon"/></svg></button>
    <button class="tbtn nodrag" id="ins-toggle" data-action="ins-toggle"><svg aria-hidden="true"><use href="#s-side-r"/></svg><span class="lbl" id="ins-lbl" aria-hidden="true"></span><span class="n" id="ins-count" hidden></span></button>
    <!-- Last in the Tab order: it takes the focus only to show its tooltip (K1). -->
    <span class="pill nodrag" data-tone="warning" id="fake-badge" tabindex="0" data-tip="OMA_FAKE_AGENT=1" hidden>Fake agents</span>
  </header>

  <!-- chat -->
  <main class="content view" data-view="chat" aria-label="Chat" data-i18n-aria="nav.chat">
    <h1 class="sr-only" data-i18n="nav.chat">Chat</h1>
    <div class="thread" id="chat-thread"></div>
    <section class="dock" id="dock" aria-label="Terminal and side question" data-i18n-aria="dock.aria" hidden>
      <div class="edge-rz h" id="dock-rz" role="separator" aria-orientation="horizontal" aria-controls="dock" tabindex="0" data-i18n-tip="dock.rz" data-tip-key="↑ ↓"></div>
      <header class="dock-h">
        <div class="dock-tabs" role="tablist" aria-label="Terminal and side question" data-i18n-aria="dock.aria"><button type="button" role="tab" class="dock-tab" id="dock-tab-tm" data-action="dock-tab" data-v="tm" aria-controls="tm" aria-selected="false"><svg class="sym" aria-hidden="true"><use href="#s-term"/></svg><span id="tm-title" data-i18n="term.title">Terminal</span></button><button type="button" role="tab" class="dock-tab" id="dock-tab-sq" data-action="dock-tab" data-v="sq" aria-controls="sq" aria-selected="false"><svg class="sym" aria-hidden="true"><use href="#s-side-q"/></svg><span id="sq-title" data-i18n="sq.title">Side question</span></button></div>
        <div class="dock-tools" data-for="tm"><div class="tm-tabs" id="tm-tabs" role="tablist" data-i18n-aria="term.tabs" hidden></div><button type="button" class="tm-ib" id="tm-new" data-action="pty-new" data-i18n-aria="term.new" data-i18n-tip="term.new" hidden><svg class="sym" aria-hidden="true"><use href="#s-plus"/></svg></button><button type="button" class="tm-ib tm-pick" id="tm-shell" data-action="pty-shells" aria-haspopup="menu" data-i18n-tip="term.shells" hidden><svg class="sym" aria-hidden="true"><use href="#s-chev"/></svg></button><span id="tm-cwd-slot"></span><span class="gap"></span><span class="tm-off" id="tm-off" role="img" data-i18n-aria="term.err.ptyOff" data-i18n-tip="term.err.ptyOff" tabindex="0" hidden><svg class="sym" aria-hidden="true"><use href="#s-alert"/></svg></span><button type="button" class="tm-ib" id="tm-find-btn" data-action="tm-find" data-i18n-tip="term.find" hidden><svg class="sym" aria-hidden="true"><use href="#s-search"/></svg></button><button type="button" class="tm-tb" data-action="tm-clear" data-i18n="term.clear">Clear</button></div>
        <div class="dock-tools" data-for="sq" hidden><span class="sq-wall"><svg class="sym" aria-hidden="true"><use href="#s-lock"/></svg><span data-i18n="sq.wall">Separate context</span></span><span class="gap"></span><button type="button" class="tm-tb" data-action="sq-close" data-i18n="sq.close">Close and forget</button></div>
        <button type="button" class="dock-ib" id="dock-hide" data-action="dock-hide"><svg aria-hidden="true"><use href="#s-chev"/></svg></button>
      </header>
      <section class="sq" id="sq" role="tabpanel" aria-labelledby="dock-tab-sq" hidden>
        <div class="sq-t" id="sq-thread"></div>
        <form class="composer sq-c" id="sq-form" autocomplete="off"><textarea class="field input" id="sq-input" rows="1" data-i18n-aria="sq.title" data-i18n-ph="sq.placeholder"></textarea><span class="ctx" id="sq-ctx" role="img"></span><button class="send" type="submit" id="sq-send" aria-label="Send" data-i18n-tip="send"><svg class="sym"><use href="#s-up"/></svg></button></form>
      </section>
      <section class="tm" id="tm" role="tabpanel" aria-labelledby="dock-tab-tm" hidden>
        <div class="tm-x" id="tm-x" hidden><div class="findbar tm-find" id="tm-find" role="search" data-i18n-aria="term.find" hidden><svg class="sym" aria-hidden="true"><use href="#s-search"/></svg><input id="tm-q" type="text" spellcheck="false" autocomplete="off" data-i18n-aria="term.find"><span class="cnt" id="tm-cnt" aria-live="polite"></span><button type="button" class="btn btn-icon btn-sm btn-ghost" data-action="tm-find-prev" data-i18n-tip="find.prev"><svg class="sym" aria-hidden="true"><use href="#s-up"/></svg></button><button type="button" class="btn btn-icon btn-sm btn-ghost flip" data-action="tm-find-next" data-i18n-tip="find.next"><svg class="sym" aria-hidden="true"><use href="#s-up"/></svg></button><button type="button" class="btn btn-icon btn-sm btn-ghost" data-action="tm-find-close" data-i18n-tip="find.close"><svg class="sym" aria-hidden="true"><use href="#s-x"/></svg></button></div></div>
        <div class="tm-t" id="tm-thread" role="log"></div>
        <form class="tm-c" id="tm-form" autocomplete="off"><span class="tm-ps" aria-hidden="true">$</span><textarea class="tm-input" id="tm-input" rows="1" spellcheck="false" data-i18n-aria="term.inputAria" data-i18n-ph="term.placeholder"></textarea></form>
      </section>
    </section>
    <form class="composer" id="chat-form" autocomplete="off">
      <div class="dstat" id="chat-dstat" hidden></div>
      <div class="cerr" id="chat-err" role="alert" hidden></div>
      <div class="cerr warn" id="chat-off" role="alert" hidden></div>
      <div class="rchip" id="chat-reply" hidden></div>
      <div class="fchips" id="chat-files" hidden></div>
      <div class="sh-bar" id="chat-shbar" hidden></div>
      <span class="sh-bang" id="chat-bang" aria-hidden="true" hidden>!</span>
      <textarea class="field input" id="chat-input" rows="1" aria-label="Message" data-i18n-aria="aria.message"></textarea>
      <button type="button" class="sqb" id="chat-tm" data-action="tm-toggle" aria-pressed="false" aria-label="Terminal"></button>
      <button type="button" class="sqb" id="chat-sq" data-action="sq-toggle" aria-pressed="false" aria-label="Side question"></button>
      <button type="button" class="ctx" id="chat-ctx" data-action="ctx-menu" aria-haspopup="menu"></button>
      <button class="send" type="submit" id="chat-send" aria-label="Send" data-i18n-tip="send"><svg class="sym"><use href="#s-up"/></svg></button>
    </form>
  </main>
  <aside class="inspector view" aria-label="Right sidebar" data-i18n-aria="ins.tabs" data-view="chat" id="chat-ins"></aside>

  <!-- Worker -->
  <main class="content view" data-view="worker" aria-label="Worker" hidden>
    <div class="wk-list" id="wk-list"></div>
    <div class="wk-session" id="wk-session" hidden>
      <div class="shead">
        <button class="btn btn-icon btn-lg" data-action="close-session" data-i18n-tip="ws.back"><svg aria-hidden="true"><use href="#s-back"/></svg></button>
        <span class="st"><b id="ws-title" role="heading" aria-level="1"></b><small id="ws-sub"></small></span>
        <div class="seg seg-lg ws-tabs" id="ws-tabs" role="tablist"></div>
      </div>
      <div class="thread" id="ws-thread" role="tabpanel" aria-labelledby="ws-tab-chat"></div>
      <div class="diffv" id="ws-diff" role="tabpanel" aria-labelledby="ws-tab-changes" hidden></div>
      <div class="diffv" id="ws-sum" role="tabpanel" aria-labelledby="ws-tab-summary" hidden></div>
      <form class="composer" id="ws-form" autocomplete="off">
        <div class="cerr" id="ws-err" role="alert" hidden></div>
        <div class="cstrip" id="ws-dec" hidden></div>
        <div class="rchip" id="ws-reply" hidden></div>
        <div class="fchips" id="ws-files" hidden></div>
        <textarea class="field input" id="ws-input" rows="1" aria-label="Message to the Worker" data-i18n-aria="aria.wsMessage"></textarea>
        <button class="send" type="submit" id="ws-send" aria-label="Send" data-i18n-tip="send"><svg class="sym"><use href="#s-up"/></svg></button>
      </form>
    </div>
  </main>
  <aside class="inspector view" aria-label="Right sidebar" data-i18n-aria="ins.tabs" data-view="worker" id="wk-ins" hidden></aside>

  <!-- repositories -->
  <main class="content view" data-view="repo" id="repo-main" aria-label="Repositories" data-i18n-aria="nav.repo" hidden></main>
  <aside class="inspector view" aria-label="Right sidebar" data-i18n-aria="ins.tabs" data-view="repo" id="repo-ins" hidden></aside>

  <!-- memory -->
  <main class="content view" data-view="memory" aria-label="Memory" data-i18n-aria="nav.memory" hidden>
    <div class="vhead"><b role="heading" aria-level="1" data-i18n="nav.memory">Memory</b><span class="vhead-r" id="mem-sync"></span></div>
    <label class="searchbar"><svg class="sym" aria-hidden="true"><use href="#s-search"/></svg><input id="mem-q" type="search" data-i18n-ph="mem.search" aria-label="Search memory" data-i18n-aria="aria.memSearch"></label>
    <div class="lst scroll" id="mem-list"></div>
  </main>
  <aside class="inspector view" aria-label="Right sidebar" data-i18n-aria="ins.tabs" data-view="memory" id="mem-ins" hidden></aside>
  <div class="rz nodrag" id="rz-ins" role="separator" aria-label="Resize the sidebar" data-i18n-aria="aria.resize" aria-orientation="vertical" aria-controls="chat-ins wk-ins repo-ins mem-ins" tabindex="0"></div>
</div>

<div class="settings-win" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="menu ctxmenu" id="ctxmenu" role="menu" hidden></div>
<div class="upop" id="usage-pop" role="dialog" aria-label="Usage per account" data-i18n-aria="usage.dialog" hidden></div>
<div id="dlg" hidden></div>
<div id="cmdk" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<!-- New agent messages are read out from here; the threads themselves are not live regions (L14). -->
<div class="sr-only" id="live" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="app.js"></script>
</body>
</html>
