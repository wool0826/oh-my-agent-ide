<div class="win" id="win" data-icons="line">
  <nav class="sidebar" aria-label="Status" data-i18n-aria="aria.status">
    <div class="lights drag"></div>
    <div class="side-scroll" id="side"></div>
    <div class="side-foot"><button class="foot-btn" data-action="open-settings" data-i18n-tip="set.title"><svg aria-hidden="true"><use href="#s-gear"/></svg></button><button class="foot-btn" id="side-toggle" data-action="side-toggle" aria-controls="side"><svg aria-hidden="true"><use href="#s-side-l"/></svg></button></div>
  </nav>
  <div class="rz nodrag" id="rz-side" role="separator" aria-label="Resize the sidebar" data-i18n-aria="aria.resize" aria-orientation="vertical" aria-controls="side" tabindex="0"></div>

  <header class="toolbar drag">
    <span class="seg nodrag" role="group" aria-label="Views" data-i18n-aria="aria.views">
      <button data-v="chat" aria-pressed="true" data-i18n="nav.chat">Chat</button><button data-v="worker" aria-pressed="false">Worker</button><button data-v="repo" aria-pressed="false" data-i18n="nav.repo">Repositories</button><button data-v="memory" aria-pressed="false" data-i18n="nav.memory">Memory</button>
    </span>
    <span class="pill orange" id="fake-badge" tabindex="0" data-tip="OMA_FAKE_AGENT=1" hidden>Fake agents</span>
    <button class="tbtn nodrag" id="cmdk-btn" data-action="cmdk-open" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#s-search"/></svg></button>
    <div class="usage nodrag" id="usage" tabindex="0" role="img" aria-label="Usage per account" aria-describedby="usage-pop"></div>
    <button class="tbtn nodrag" id="ins-toggle" data-action="ins-toggle"><svg aria-hidden="true"><use href="#s-side-r"/></svg><span class="n" id="ins-count" hidden></span></button>
  </header>

  <!-- chat -->
  <main class="content view" data-view="chat">
    <div class="thread" id="chat-thread"></div>
    <section class="sq" id="sq" role="dialog" aria-labelledby="sq-title" hidden>
      <header><svg class="sym" aria-hidden="true"><use href="#s-side-q"/></svg><b id="sq-title" data-i18n="sq.title">Side question</b><span class="sq-wall"><svg class="sym" aria-hidden="true"><use href="#s-lock"/></svg><span data-i18n="sq.wall">Separate context</span></span><span class="gap"></span><button type="button" class="sq-ib" data-action="sq-min" data-i18n-tip="sq.minimise"><svg aria-hidden="true"><use href="#s-minus"/></svg></button><button type="button" class="sq-ib" data-action="sq-close" data-i18n-tip="sq.close"><svg aria-hidden="true"><use href="#s-x"/></svg></button></header>
      <div class="sq-t" id="sq-thread"></div>
      <form class="composer sq-c" id="sq-form" autocomplete="off"><textarea class="field input" id="sq-input" rows="1" data-i18n-aria="sq.title" data-i18n-ph="sq.placeholder"></textarea><span class="ctx" id="sq-ctx" role="img"></span><button class="send" type="submit" id="sq-send" aria-label="Send"><svg class="sym"><use href="#s-up"/></svg></button></form>
    </section>
    <form class="composer" id="chat-form" autocomplete="off">
      <div class="dstat" id="chat-dstat" hidden></div>
      <div class="cerr" id="chat-err" role="alert" hidden></div>
      <div class="rchip" id="chat-reply" hidden></div>
      <div class="fchips" id="chat-files" hidden></div>
      <div class="sh-bar" id="chat-shbar" hidden></div>
      <span class="sh-bang" id="chat-bang" aria-hidden="true" hidden>!</span>
      <textarea class="field input" id="chat-input" rows="1" aria-label="Message" data-i18n-aria="aria.message"></textarea>
      <button type="button" class="sqb" id="chat-sq" data-action="sq-toggle" aria-pressed="false" aria-label="Side question"></button>
      <button type="button" class="ctx" id="chat-ctx" data-action="ctx-menu" aria-haspopup="menu"></button>
      <button class="send" type="submit" id="chat-send" aria-label="Send"><svg class="sym"><use href="#s-up"/></svg></button>
    </form>
  </main>
  <aside class="inspector view" data-view="chat" id="chat-ins"></aside>

  <!-- Worker -->
  <main class="content view" data-view="worker" hidden>
    <div class="wk-list" id="wk-list"></div>
    <div class="wk-session" id="wk-session" hidden>
      <div class="shead">
        <button class="back" data-action="close-session" data-i18n-tip="ws.back"><svg aria-hidden="true"><use href="#s-back"/></svg></button>
        <span class="st"><b id="ws-title"></b><small id="ws-sub"></small></span>
        <div class="segc ws-tabs" id="ws-tabs" role="tablist"></div>
      </div>
      <div class="thread" id="ws-thread"></div>
      <div class="diffv" id="ws-diff" hidden></div>
      <div class="diffv" id="ws-sum" hidden></div>
      <form class="composer" id="ws-form" autocomplete="off">
        <div class="cerr" id="ws-err" role="alert" hidden></div>
        <div class="cstrip" id="ws-dec" hidden></div>
        <div class="rchip" id="ws-reply" hidden></div>
        <div class="fchips" id="ws-files" hidden></div>
        <textarea class="field input" id="ws-input" rows="1" aria-label="Message to the Worker" data-i18n-aria="aria.wsMessage"></textarea>
        <button class="send" type="submit" id="ws-send" aria-label="Send"><svg class="sym"><use href="#s-up"/></svg></button>
      </form>
    </div>
  </main>
  <aside class="inspector view" data-view="worker" id="wk-ins" hidden></aside>

  <!-- repositories -->
  <main class="content view" data-view="repo" id="repo-main" hidden></main>
  <aside class="inspector view" data-view="repo" id="repo-ins" hidden></aside>

  <!-- memory -->
  <main class="content view" data-view="memory" hidden>
    <div class="vhead"><b data-i18n="nav.memory">Memory</b><span class="vhead-r" id="mem-sync"></span></div>
    <label class="searchbar"><svg class="sym" aria-hidden="true"><use href="#s-search"/></svg><input id="mem-q" type="search" data-i18n-ph="mem.search" aria-label="Search memory" data-i18n-aria="aria.memSearch"></label>
    <div class="lst scroll" id="mem-list"></div>
  </main>
  <aside class="inspector view" data-view="memory" id="mem-ins" hidden></aside>
  <div class="rz nodrag" id="rz-ins" role="separator" aria-label="Resize the sidebar" data-i18n-aria="aria.resize" aria-orientation="vertical" aria-controls="chat-ins wk-ins repo-ins mem-ins" tabindex="0"></div>
</div>

<div class="settings-win" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="ctxmenu" id="ctxmenu" role="menu" hidden></div>
<div class="upop" id="usage-pop" role="dialog" aria-label="Usage per account" data-i18n-aria="usage.dialog" hidden></div>
<div id="dlg" hidden></div>
<div id="cmdk" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<!-- New agent messages are read out from here; the threads themselves are not live regions (L14). -->
<div class="sr-only" id="live" aria-live="polite"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script src="app.js"></script>
</body>
</html>
