# Checks every pull request and every push to main on both platforms the app ships for.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, unit tests, the bundle and packaging, once per system.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packages the app without making an installer or signing it: proves the bundle can be put together here.
      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # The app itself, with fake agents and a stand-in for gh: no account, no network. test/e2e/shard.mjs deals the
  # test/e2e/*.e2e.mjs files out to the shards by their number of flows, so a new file joins one without a change here.
  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: End-to-end flows
        run: node test/e2e/shard.mjs ${{ matrix.shard }}/3
        timeout-minutes: 8
      # A failed flow leaves a picture of the window, its page and the app's logs (test/e2e/harness.mjs).
      - name: Keep what failed end-to-end flows showed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14

  # The main screens in both themes against the pictures in test/e2e/visual/ (test/e2e/visual.e2e.mjs). Fonts draw
  # differently on each system, so this runs on the one the pictures are of. Not a required check yet.
  visual:
    name: visual (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Screen comparison
        run: npm run e2e:visual
        timeout-minutes: 8
      # Each screen that differs leaves its expected, actual and diff pictures; the flow's window and logs are beside them.
      - name: Keep the pictures of the screens that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/visual/
            test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
