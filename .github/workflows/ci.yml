# Checks every pull request and every push to main on both platforms the app ships for.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The app itself, with fake agents and a stand-in for gh: no account, no network.
      - name: End-to-end flows
        run: npm run e2e
        timeout-minutes: 8
      # A failed flow leaves a picture of the window, its page and the app's logs (test/e2e/harness.mjs).
      - name: Keep what failed end-to-end flows showed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.os }}
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 14
      # Packages the app without making an installer or signing it: proves the bundle can be put together here.
      - name: Package (unpacked)
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
